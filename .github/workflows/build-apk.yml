name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=${f#app-}
            abi=${abi%-release.apk}
            mv "$f" "mediainfo_custom-${{ env.VERSION }}-$abi.apk"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: build/app/outputs/flutter-apk/mediainfo_custom-*.apk

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get
      - run: flutter build linux --release

      # ── tar.gz ───────────────────────────────────────────────
      - name: Package tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/mediainfo_custom-${{ env.VERSION }}-linux-x64.tar.gz" bundle

      # ── .deb ─────────────────────────────────────────────────
      - name: Package deb
        run: |
          APP=mediainfo-custom
          BINARY=mediainfo_custom
          VERSION=${{ env.VERSION }}
          BUNDLE=build/linux/x64/release/bundle
          DEBDIR=/tmp/${APP}_deb

          mkdir -p "$DEBDIR/DEBIAN"
          mkdir -p "$DEBDIR/usr/bin"
          mkdir -p "$DEBDIR/usr/lib/$APP"
          mkdir -p "$DEBDIR/usr/share/applications"
          mkdir -p "$DEBDIR/usr/share/icons/hicolor/512x512/apps"

          cp -r "$BUNDLE/." "$DEBDIR/usr/lib/$APP/"
          cat > "$DEBDIR/usr/bin/$BINARY" << EOF
          #!/bin/bash
          exec /usr/lib/$APP/$BINARY "\$@"
          EOF
          chmod +x "$DEBDIR/usr/bin/$BINARY"

          cp web/icons/Icon-512.png "$DEBDIR/usr/share/icons/hicolor/512x512/apps/$APP.png"

          cat > "$DEBDIR/usr/share/applications/$APP.desktop" << EOF
          [Desktop Entry]
          Name=MediaInfo Custom
          Comment=Media file analyzer - image, video info and diff
          Exec=$BINARY
          Icon=$APP
          Terminal=false
          Type=Application
          Categories=Utility;AudioVideo;
          EOF

          cat > "$DEBDIR/DEBIAN/control" << EOF
          Package: $APP
          Version: $VERSION
          Architecture: amd64
          Maintainer: mediainfo_custom
          Description: Media file analyzer - image, video info and diff
          Depends: libgtk-3-0, libblkid1, liblzma5
          EOF

          dpkg-deb --build "$DEBDIR" "mediainfo_custom-$VERSION-linux-x64.deb"

      # ── AppImage ──────────────────────────────────────────────
      - name: Package AppImage
        run: |
          APP=mediainfo-custom
          BINARY=mediainfo_custom
          VERSION=${{ env.VERSION }}
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=/tmp/${APP}.AppDir

          wget -q -L \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool

          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp -r "$BUNDLE/." "$APPDIR/usr/bin/"

          cp web/icons/Icon-512.png "$APPDIR/$APP.png"
          cp web/icons/Icon-512.png "$APPDIR/.DirIcon"
          cp web/icons/Icon-512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/$APP.png"

          cat > "$APPDIR/$APP.desktop" << EOF
          [Desktop Entry]
          Name=MediaInfo Custom
          Comment=Media file analyzer - image, video info and diff
          Exec=$BINARY
          Icon=$APP
          Terminal=false
          Type=Application
          Categories=Utility;AudioVideo;
          EOF
          cp "$APPDIR/$APP.desktop" "$APPDIR/usr/share/applications/"

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/mediainfo_custom" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            "$APPDIR" "mediainfo_custom-$VERSION-linux-x64.AppImage"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            mediainfo_custom-*-linux-x64.tar.gz
            mediainfo_custom-*-linux-x64.deb
            mediainfo_custom-*-linux-x64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        run: |
          $VERSION = (Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace 'version: ' , '' -replace '\+.*', ''
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "mediainfo_custom-${{ env.VERSION }}-windows-x64.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: mediainfo_custom-*-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app \
            "$GITHUB_WORKSPACE/mediainfo_custom-${{ env.VERSION }}-macos.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: mediainfo_custom-*-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: mediainfo_custom ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## mediainfo_custom

            A lightweight app to inspect photo and video metadata: image size, EXIF data, file hashes, and file comparison (diff).

            ### Downloads
            - **Android**: `mediainfo_custom-{version}-arm64-v8a.apk` (most modern phones), `mediainfo_custom-{version}-armeabi-v7a.apk` (older 32-bit), `mediainfo_custom-{version}-x86_64.apk` (emulators)
            - **Windows**: `mediainfo_custom-{version}-windows-x64.zip`, unzip and run the `.exe`
            - **Linux**:
              - `mediainfo_custom-{version}-linux-x64.AppImage` — portable, runs directly without installation (requires `libfuse2`)
              - `mediainfo_custom-{version}-linux-x64.deb` — install using `sudo dpkg -i *.deb` on Ubuntu/Debian
              - `mediainfo_custom-{version}-linux-x64.tar.gz` — extract and run the executable in `bundle/`
            - **macOS**: `mediainfo_custom-{version}-macos.zip`, unzip and open the `.app`

            ### Notes
            - Android build is signed with a debug key, for testing only.
            - Desktop builds are unsigned. Windows may show a SmartScreen warning ("More info", then "Run anyway"). On macOS, if the app is blocked, run `xattr -cr mediainfo_custom.app` in Terminal, or right-click the app and choose Open.
            - On desktop, install [ExifTool](https://exiftool.org) and make sure it is in your PATH to see extra metadata.
            - On Linux, AppImage requires `libfuse2`: `sudo apt install libfuse2` (Ubuntu 22.04) or `sudo apt install libfuse2t64` (Ubuntu 24.04).