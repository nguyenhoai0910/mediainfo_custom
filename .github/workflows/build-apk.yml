name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']          # push tag dạng v1.0.0 sẽ tạo Release kèm APK
  workflow_dispatch:       # cho phép bấm chạy tay trên GitHub

permissions:
  contents: write          # cần để tạo Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: mediainfo_custom ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## mediainfo_custom

            A lightweight app to inspect photo and video metadata: image size, EXIF data, file hashes, and file comparison (diff).

            ### Which file should I download?
            - `app-arm64-v8a-release.apk`: most modern Android phones (recommended)
            - `app-armeabi-v7a-release.apk`: older 32-bit devices
            - `app-x86_64-release.apk`: emulators / x86 devices

            ### Installation
            1. Download the APK that matches your device.
            2. Allow installation from unknown sources when prompted.
            3. Open the APK and tap Install.

            ### Notes
            - Requires Android 8.0 or later.
            - This build is signed with a debug key, so it is intended for testing only.
            - If you already installed a build signed with a different key, uninstall it first.
          files: build/app/outputs/flutter-apk/*.apk
