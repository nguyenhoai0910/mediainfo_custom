name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=${f#app-}
            abi=${abi%-release.apk}
            mv "$f" "mediainfo_custom-$abi.apk"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: build/app/outputs/flutter-apk/mediainfo_custom-*.apk

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/mediainfo_custom-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: mediainfo_custom-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mediainfo_custom-windows-x64.zip
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: mediainfo_custom-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/mediainfo_custom-macos.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: mediainfo_custom-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: mediainfo_custom ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## mediainfo_custom

            A lightweight app to inspect photo and video metadata: image size, EXIF data, file hashes, and file comparison (diff).

            ### Downloads
            - **Android**: `mediainfo_custom-arm64-v8a.apk` (most modern phones), `mediainfo_custom-armeabi-v7a.apk` (older 32-bit), `mediainfo_custom-x86_64.apk` (emulators)
            - **Windows**: `mediainfo_custom-windows-x64.zip`, unzip and run the `.exe`
            - **Linux**: `mediainfo_custom-linux-x64.tar.gz`, extract and run the executable in `bundle/`
            - **macOS**: `mediainfo_custom-macos.zip`, unzip and open the `.app`

            ### Notes
            - Android build is signed with a debug key, for testing only.
            - Desktop builds are unsigned. Windows may show a SmartScreen warning ("More info", then "Run anyway"). On macOS, if the app is blocked, run `xattr -cr mediainfo_custom.app` in Terminal, or right-click the app and choose Open.
            - On desktop, install [ExifTool](https://exiftool.org) and make sure it is in your PATH to see extra metadata.